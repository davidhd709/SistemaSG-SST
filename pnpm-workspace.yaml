packages:
  - backend
  - frontend

# pnpm 11 requires an explicit decision for each dependency build script.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  lmdb: true
  msgpackr-extract: false
  prisma: true
  puppeteer: true
  unrs-resolver: true
