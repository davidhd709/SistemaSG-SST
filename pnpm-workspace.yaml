packages:
  - backend
  - frontend

# pnpm 11 requires an explicit decision for each dependency build script.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  lmdb: true
  msgpackr-extract: false
  prisma: true
  puppeteer: true
  unrs-resolver: true

# Parches dentro de la misma versión mayor para dependencias transitivas de
# exceljs (archiver → glob → minimatch) con avisos de denegación de servicio.
overrides:
  'brace-expansion@>=1 <2': ^1.1.21
  'brace-expansion@>=2 <3': ^2.1.7
