# Sitio del Nginx del VPS (proxy de entrada) para sst.opainn.com.
# Se instala en /etc/nginx/sites-available/sst.opainn.com. Certbot agrega el
# bloque HTTPS (443) y la redirección desde HTTP al emitir el certificado.

server {
    listen 80;
    listen [::]:80;
    server_name sst.opainn.com;

    # Firmas y fotos de evidencia; el Nginx del contenedor también limita a 12 MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Los navegadores solo la aplican cuando llega por HTTPS.
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
